---
layout: default
---
<article class="page post">
  <header class="page-header">
    <p class="eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.tag %} · {{ page.tag }}{% endif %}
    </p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/archive/' | relative_url }}">← All updates</a></p>
</article>
