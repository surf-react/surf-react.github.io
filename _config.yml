title: SurfReact
description: >-
  Theoretical chemistry group modelling reactions at solid–gas and
  solid–liquid interfaces. Department of Physical Chemistry,
  Palacký University Olomouc, Czechia.
lang: en

# If the site is served from https://<user>.github.io/<repo>/,
# set baseurl to "/<repo>". For https://<user>.github.io/ or a
# custom domain, leave it empty.
baseurl: ""
url: "https://surf-react.github.io"

permalink: /archive/:year/:month/:title/

# SEO: both plugins are whitelisted and bundled by GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Used by jekyll-seo-tag for meta tags and JSON-LD
author: SurfReact group
twitter:
  card: summary_large_image
logo: /assets/img/logo.svg

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

exclude:
  - README.md
  - LICENSE
