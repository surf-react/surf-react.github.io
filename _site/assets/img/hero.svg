<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-label="Molecules reacting on a periodic solid surface">
  <rect width="500" height="400" fill="#FFFFFF"/>
  <!-- gas phase -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#B25A2B" stroke-width="4">
      <line x1="90" y1="80" x2="116" y2="64"/>
    </g>
    <path d="M120 75 Q 170 130, 205 178" stroke="#B25A2B" stroke-width="2" stroke-dasharray="2 7"/>
    <path d="M370 70 Q 340 130, 315 178" stroke="#0F6B70" stroke-width="2" stroke-dasharray="2 7"/>
  </g>
  <circle cx="88" cy="81" r="10" fill="#B25A2B"/>
  <circle cx="118" cy="63" r="8" fill="#D98E5B"/>
  <circle cx="372" cy="62" r="9" fill="#0F6B70"/>
  <circle cx="398" cy="76" r="9" fill="#0F6B70"/>
  <!-- adsorbates at the interface -->
  <circle cx="208" cy="184" r="11" fill="#B25A2B"/>
  <circle cx="312" cy="184" r="11" fill="#0F6B70"/>
  <!-- interface line -->
  <line x1="0" y1="206" x2="500" y2="206" stroke="#14262E" stroke-width="2"/>
  <!-- lattice layers -->
  <g fill="#1F3B46">
    <circle cx="25" cy="228" r="15"/><circle cx="90" cy="228" r="15"/>
    <circle cx="155" cy="228" r="15"/><circle cx="220" cy="228" r="15"/>
    <circle cx="285" cy="228" r="15"/><circle cx="350" cy="228" r="15"/>
    <circle cx="415" cy="228" r="15"/><circle cx="480" cy="228" r="15"/>
  </g>
  <g fill="#14262E">
    <circle cx="58" cy="266" r="15"/><circle cx="123" cy="266" r="15"/>
    <circle cx="188" cy="266" r="15"/><circle cx="253" cy="266" r="15"/>
    <circle cx="318" cy="266" r="15"/><circle cx="383" cy="266" r="15"/>
    <circle cx="448" cy="266" r="15"/>
  </g>
  <g fill="#1F3B46">
    <circle cx="25" cy="304" r="15"/><circle cx="90" cy="304" r="15"/>
    <circle cx="155" cy="304" r="15"/><circle cx="220" cy="304" r="15"/>
    <circle cx="285" cy="304" r="15"/><circle cx="350" cy="304" r="15"/>
    <circle cx="415" cy="304" r="15"/><circle cx="480" cy="304" r="15"/>
  </g>
  <rect x="0" y="322" width="500" height="78" fill="#14262E"/>
  <text x="250" y="368" text-anchor="middle" font-family="monospace" font-size="15" fill="#7A8F96">placeholder — replace with your hero image</text>
</svg>
